    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a73e8'/%3E%3Ctext x='32' y='42' font-family='Inter,Arial,Helvetica,sans-serif' font-size='25' font-weight='500' fill='white' text-anchor='middle'%3EUM%3C/text%3E%3C/svg%3E"
    />
    <meta name="author" content="Evan Lim Hong Yan" />
    <meta name="creator" content="UM 3D Atlas by Evan Lim Hong Yan" />
    <link rel="canonical" href="https://um-3d-atlas.netlify.app/" />
    <meta
      name="description"
      content="Interactive 3D campus atlas for Universiti Malaya featuring verified campus buildings, indoor rooms, jogging loops, multi-modal routing, and live shuttle transit."
    />
    <meta property="og:title" content="UM 3D Atlas — Universiti Malaya Campus Map" />
    <meta
      property="og:description"
      content="Interactive 3D campus atlas for Universiti Malaya featuring verified campus buildings, indoor rooms, jogging loops, multi-modal routing, and live shuttle transit."
    />
    <meta property="og:url" content="https://um-3d-atlas.netlify.app/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "UM 3D Atlas",
        "applicationCategory": "NavigationApplication",
        "operatingSystem": "Web",
        "url": "https://um-3d-atlas.netlify.app/",
        "author": {
          "@type": "Person",
          "name": "Evan Lim Hong Yan"
        },
        "creator": {
          "@type": "Person",
          "name": "Evan Lim Hong Yan"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('um-atlas-theme-v1');
          var theme = t === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#202124' : '#1a73e8');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

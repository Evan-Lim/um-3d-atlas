[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let the client shell resolve deep links cleanly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch fresh HTML shell so new deploys take effect immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Revalidate deterministic app bundles on deploy (versioned via ?v= query param).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Always revalidate campus GeoJSON/JSON datasets on deploy.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let the client router (and map deep links) resolve to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted bundles can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Campus datasets are versioned by deployment; cache them for a day.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
